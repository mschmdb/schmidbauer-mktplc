<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Overflow</title>
<style>
body { margin: 0; font: 16px/1.5 sans-serif; }
p { margin: 0 0 16px; padding: 0 16px; }
.wide { width: 900px; height: 40px; background: #cde; }
.scroller { overflow-x: auto; width: 100%; }
.scroller .track { width: 1600px; height: 40px; background: #edc; }
.fixed { position: fixed; top: 0; left: 100%; width: 200px; height: 20px; background: #ccc; }
</style></head>
<body>
<h1 style="padding: 0 16px">Overflowing page</h1>
<p>Short intro text that fits the viewport.</p>
<div class="wide" id="wide">A box that is wider than a phone.</div>
<div class="scroller"><div class="track" id="track">Inside a scroll container.</div></div>
<div class="fixed">Off-canvas panel</div>
</body></html>
