<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Filled and outlined buttons</title>
<style>
body { margin: 0; padding: 40px; font: 16px/1.2 Arial, sans-serif; color: #1a1a1a; background: #fff; }
.btn { display: inline-block; box-sizing: border-box; width: 160px; padding: 12px 24px; text-align: center; font-size: 16px; font-weight: 600; text-decoration: none; }
.primary { background: #1d4ed8; color: #fff; border: 2px solid #1d4ed8; }
.secondary { background: transparent; color: #1a1a1a; border: 2px solid #1a1a1a; }
</style></head>
<body>
<a class="btn secondary" href="/b">Outlined</a>
<a class="btn primary" href="/a">Filled</a>
</body></html>
