<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>First viewport</title>
<style>
body { margin: 0; font: 16px/1.5 Arial, sans-serif; }
.hero { position: relative; height: 400px; background: #223 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><rect width='10' height='10' fill='%23446'/></svg>"); color: #fff; padding: 40px; box-sizing: border-box; }
.hero h1 { font-size: 48px; margin: 0 0 16px; }
.hero h2 { font-size: 48px; margin: 0 0 16px; }
.hero p { font-size: 16px; margin: 0; }
.b { display: inline-block; padding: 10px 20px; background: #e11d48; color: #fff; border: 0; font-size: 16px; }
.b2 { display: inline-block; padding: 10px 20px; background: #2563eb; color: #fff; border: 0; font-size: 16px; }
.ghost { display: inline-block; padding: 10px 20px; background: transparent; color: #111; border: 1px solid #111; }
.tiny { display: inline-block; padding: 0 4px; background: #eee; font-size: 12px; line-height: 16px; height: 16px; }
.banner { position: fixed; left: 0; right: 0; bottom: 0; height: 160px; background: #111; color: #fff; padding: 16px; box-sizing: border-box; }

<body>
<section class="hero">
<h1>Primary promise in the hero</h1>
<h2>Second promise in the hero</h2>
<p>Text sitting on the hero background image.</p>
<div><a class="b" href="/a">Buy</a> <button class="b2">Subscribe</button> <a class="ghost" href="/c">Learn more</a> <a class="tiny" href="/t">tiny</a></div>
</section>
<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200'><rect width='400' height='200' fill='%23ccc'/></svg>" width="400" height="200" alt="">
