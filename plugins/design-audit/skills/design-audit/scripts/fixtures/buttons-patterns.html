<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button patterns</title>
<style>
body { margin: 0; font: 16px/1.4 Arial, sans-serif; color: #fff; background: #14101a; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
/* Icon-only theme toggle with a light fill on a dark header */
.toggle { width: 44px; height: 44px; border: 0; border-radius: 8px; background: #f4eff2; color: #14101a; font-size: 20px; }
main { padding: 24px; }
/* Anchors styled as buttons: sizes from min-height and side padding, no vertical padding */
.cta, .ghost { display: inline-flex; align-items: center; box-sizing: border-box; min-height: 44px; padding: 0 24px; border-radius: 6px; text-decoration: none; font-weight: 600; margin-right: 12px; }
.cta { background: #e0207a; color: #fff; border: 0; }
.ghost { background: transparent; color: #fff; border: 2px solid #fff; }
/* A lazy image link with a placeholder fill and no text */
.tile { display: block; width: 400px; height: 200px; background: #e2dfd3; margin: 24px 0; }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* Map control: translucent light fill, a plus sign as its only label */
.map { position: relative; width: 300px; height: 120px; background: #335; }
.zoom { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border: 0; background: rgba(255, 255, 255, 0.85); color: #111; font-size: 18px; }
/* Text toggle that is on or off */
.pressed { background: #2563eb; color: #fff; border: 0; padding: 10px 20px; font-size: 16px; }
</style></head>
<body>
<header><span>Brand</span><button class="toggle" type="button" aria-pressed="false" aria-label="Dark mode">&#9790;</button></header>
<main>
<h1>Headline for the page</h1>
<p><a class="cta" href="/book">Book a call</a><a class="ghost" href="/more">More about it</a><a class="ghost" href="/other">Other topic</a></p>
<a class="tile" href="/story"><img alt="Story cover" width="400" height="200" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a>
<div class="map"><button class="zoom" type="button" aria-label="Zoom in">+</button></div>
<button class="pressed" type="button" aria-pressed="true">Show closed</button>
</main>
</body></html>
