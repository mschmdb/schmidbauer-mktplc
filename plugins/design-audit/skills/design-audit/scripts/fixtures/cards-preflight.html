<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Preflight cards</title>
<style>
/* Tailwind preflight: every element gets border: 0 solid */
*, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e5e7eb; }
body { margin: 0; background: #fff; font: 16px sans-serif; }
.box { height: 160px; border-radius: 12px; margin: 10px; padding: 10px; }
.plain { }                                  /* rounded, nothing visible */
.shadow { box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.border { border-width: 1px; }
.bg { background: #f3f4f6; }
</style></head>
<body>
<main>
<div class="box plain">plain, transparent</div>
<div class="box shadow">shadow card</div>
<div class="box border">border card</div>
<div class="box bg">background card</div>
</main>
</body></html>
