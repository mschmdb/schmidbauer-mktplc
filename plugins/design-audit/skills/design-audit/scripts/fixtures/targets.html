<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Targets</title>
<style>
body { margin: 0; font: 16px/1.5 sans-serif; }
.sr { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lab { display: inline-block; width: 120px; height: 40px; }
button.s { width: 16px; height: 16px; padding: 0; border: 1px solid #333; background: #fff; }
.row { margin: 20px; }
.far { margin-left: 300px; }
</style></head>
<body>
<main>
<p>Read the <a href="/terms">terms of service</a> before you continue.</p>
<div class="row"><label class="lab"><input class="sr" type="checkbox"> Newsletter</label></div>
<div class="row"><button class="s" aria-label="isolated"></button></div>
<div class="row far"><button class="s" aria-label="left"></button><button class="s" aria-label="right" style="margin-left:2px"></button></div>
</main>
</body></html>
