<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token fixture</title>
<style>
  :root {
    --bg: #ece9e0;
    --ink: #141414;
    --accent: #3a6744;
    --text-4xl: 3rem;
  }
  [data-theme='dark'] { --bg: #12110c; }
  @media (max-width: 640px) { :root { --text-4xl: 2rem; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, serif; font-size: 16px; line-height: 1.5; }
  header { padding: 24px; }
  h1 { font-family: Helvetica, Arial, sans-serif; font-size: var(--text-4xl); font-weight: 700; line-height: 1.1; margin: 0 0 8px; }
  main { display: grid; gap: 16px; padding: 24px; }
  .card { background: #ffffff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); padding: 16px; }
  .card.alt { border-radius: 4px; }
  a.cta { display: inline-block; background: var(--accent); color: #ffffff; padding: 8px 16px; border-radius: 4px; }
  .hidden { display: none; font-family: Courier, monospace; }
</style>
</head>
<body>
<header><h1>Fixture headline</h1></header>
<main>
  <section class="card"><p>First card with body text.</p></section>
  <section class="card alt"><p>Second card with body text.</p></section>
  <a class="cta" href="#start">Start</a>
  <p class="hidden">Hidden text must not count.</p>
</main>
</body>
</html>
